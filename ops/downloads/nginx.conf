worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 128;
    gzip_types text/plain text/css application/javascript application/json;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $cache_control {
        default "no-cache";
        ~^/downloads/(PlateGo-Chrome-v[0-9.]+\.zip|SHA256SUMS-v[0-9.]+\.txt)$ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /latest.json { try_files $uri =404; }
        location = /healthz {
            default_type text/plain;
            try_files $uri =404;
        }
        location ~ ^/downloads/(PlateGo-Chrome-v[0-9.]+\.zip|SHA256SUMS-v[0-9.]+\.txt)$ {
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
